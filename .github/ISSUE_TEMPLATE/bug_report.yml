name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Found a security problem? Don't file it here, see [SECURITY.md](../blob/master/SECURITY.md). Never paste API keys or `.env` contents."
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you expected, and what you saw instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Go to ...\n2. Click ...\n3. See error"
    validations:
      required: true
  - type: dropdown
    id: provider
    attributes:
      label: Payment provider, if relevant
      options: [Not relevant, mock, Stripe, Creem, Waffo]
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: "Node 22, Windows 11, local dev / Vercel"
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Remove keys, tokens and customer data first.
      render: shell
